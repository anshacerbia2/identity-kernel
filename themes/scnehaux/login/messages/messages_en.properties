# The reference bundle (TDD-identity-kernel-004 §Message Bundle Discipline). Only the keys this theme
# changes are here; every other key is the kernel's own.
#
# A disabled account is told apart from an unknown one by the kernel's default wording, "Account is
# disabled, contact your administrator.", which tells anyone who types an identifier that it exists. It
# reads as a failed sign-in instead, exactly as the kernel already words a temporary or permanent
# lockout.
accountDisabledMessage=Invalid username or password.
