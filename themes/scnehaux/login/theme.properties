# The Scnehaux login theme (TDD-identity-kernel-004 1.1.0, ADR-IAM-001 §5.7). It names keycloak.v2 as
# its parent and replaces message bundles only: every template and stylesheet is the kernel's, so each
# Keycloak upgrade reaches these pages unchanged. A template is copied here only when a test shows the
# stock one cannot meet a requirement, and TDD-004 lists it with its reason.
parent=keycloak.v2
locales=en,id
