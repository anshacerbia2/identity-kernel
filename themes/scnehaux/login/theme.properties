# The Scnehaux login theme (TDD-identity-kernel-004 1.7.0, ADR-IAM-001 §5.7). It names keycloak.v2 as
# its parent. Its look is Identity Experience's (TDD-identity-kernel-004 §Visual Language), carried by
# one stylesheet over the kernel's own: keycloak.v2's markup and PatternFly stay, so each Keycloak
# upgrade reaches these pages unchanged. A template is copied here only when a test shows the stock one
# cannot meet a requirement, and TDD-004 lists it with its reason.
parent=keycloak.v2
locales=en,id

# The parent's stylesheet first, then the theme's. A child that names styles replaces the parent's
# list, so css/styles.css is named again; Keycloak serves it from keycloak.v2.
styles=css/styles.css css/scnehaux.css

# Identity Experience's mark, the shield its applications use as their favicon.
favicons.mark=img/scnehaux-mark.svg
favicons.mark.type=image/svg+xml
