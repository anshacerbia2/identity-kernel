name: image-scan

# STD-GLB-009 1.8.0 §Container Images (lands with scnehaux-architecture #86): every image this repository ships or runs is scanned on every
# change and daily, because a new advisory changes an unchanged image's findings. The gate fails on
# a High or Critical vulnerability with a fix; scripts/image-scan.sh says how. A finding in Keycloak
# itself is fixed by moving image/keycloak.ref to a release that fixes it, through the compatibility
# suite like every upgrade.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The images compose builds, as it builds them: the kernel image (image/Dockerfile on the pinned
      # Keycloak), realm-apply's, and the reverse proxy (Caddy built from source, caddy.Dockerfile).
      # The digest-pinned image compose pulls, Postgres, is scanned from its registry by the script.
      - name: build the shipped images
        run: |
          image="$(grep -v '^[[:space:]]*#' image/keycloak.ref | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          docker build -f image/Dockerfile --build-arg KEYCLOAK_IMAGE="$image" -t scan/identity-kernel .
          docker build -f deploy/dev/realm-apply.Dockerfile -t scan/realm-apply .
          docker build -f deploy/dev/caddy.Dockerfile -t scan/caddy deploy/dev

      - name: scan
        run: scripts/image-scan.sh scan/identity-kernel scan/realm-apply scan/caddy
