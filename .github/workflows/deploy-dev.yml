name: deploy-dev

# Brings up deploy/dev exactly as a server runs it -- production-mode Keycloak on Postgres behind
# Caddy -- applies the realm through the service account the setup script creates, and asserts the
# two properties the stack exists for: the realm is served on its public issuer, and administration
# is hidden from any address outside the allowlist. It also runs the signing-key ceremony the server
# runs, proves the kernel refuses to start without its keystore and signs with the ceremony's key, and
# ends with the database's restore drill (STD-GLB-002 §Restore Evidence).

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the restore drill, which STD-GLB-002 §Restore Evidence asks for on a schedule of at
  # most 90 days.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  stack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: the server runs the image the suite asserts
        run: |
          ref="$(grep -v '^[[:space:]]*#' ../../image/keycloak.ref | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          if ! grep -Eq "^[[:space:]]*KEYCLOAK_IMAGE:[[:space:]]*${ref}[[:space:]]*$" compose.yaml; then
            echo "::error::deploy/dev/compose.yaml does not build the kernel image from $ref in image/keycloak.ref"
            exit 1
          fi
          # The CI file's throwaway keystore is made by the kernel image itself (compose.ci.yaml).
          if ! grep -Eq "^[[:space:]]*image:[[:space:]]*scnehaux/identity-kernel:dev[[:space:]]*$" compose.ci.yaml; then
            echo "::error::deploy/dev/compose.ci.yaml does not make its keystore with the kernel image"
            exit 1
          fi

      # The allowlist names a documentation address (RFC 5737) the runner never has, so every
      # request from the runner is "outside" it.
      - name: configure the stack
        run: |
          {
            echo "KEYCLOAK_HOSTNAME=localhost"
            echo "ADMIN_ALLOW_CIDRS=192.0.2.1/32"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      # STD-GLB-009 1.8.0 rule 11 (TDD-identity-kernel-005 §Images the Stack Runs): no image this stack
      # names without a digest is pulled from a registry. Compose pulls a name before building it unless
      # pull_policy says otherwise, so every such name must be build where its service builds it and
      # never elsewhere. Checked on every file set the stack runs, before anything is pulled.
      - name: no image named here is pulled from a registry
        run: |
          files=()
          for set in compose.yaml compose.yaml:compose.tunnel.yaml compose.yaml:compose.ci.yaml; do
            out="$RUNNER_TEMP/compose-config-${set//[:.]/-}.json"
            COMPOSE_FILE="$set" docker compose config --format json > "$out"
            files+=("$out")
          done
          python3 ../../.github/scripts/pull-policy.py "${files[@]}"

      # The kernel refuses to start without the realm signing keystore and its password: before the
      # ceremony there is none, and the image's entrypoint stops Keycloak before it can generate one
      # (image/start.sh, TDD-identity-kernel-002 1.2.0 §Startup as Built). compose.yaml alone, as a server
      # runs it: the CI file would give it a throwaway keystore.
      - name: the kernel refuses to start without its signing keystore
        run: |
          docker compose -f compose.yaml up -d postgres keycloak
          refused=0
          for i in $(seq 1 90); do
            if docker compose -f compose.yaml logs --no-color keycloak 2>&1 | grep -F "refusing to start: the realm signing keystore"; then
              refused=1
              break
            fi
            sleep 2
          done
          if docker compose -f compose.yaml logs --no-color keycloak 2>&1 | grep -q "Keycloak.*started"; then
            echo "::error::Keycloak started without its signing keystore"
            exit 1
          fi
          docker compose -f compose.yaml down
          [ "$refused" = 1 ] || { echo "::error::the kernel did not refuse to start without its keystore"; exit 1; }

      # The ceremony as the runbook runs it (docs/runbooks/signing-key-ceremony.md): an operator and a
      # witness, never the same person, and never a second key over the first.
      - name: the signing-key ceremony
        run: |
          if bash ../../scripts/signing-key-ceremony.sh ./keys "CI Operator" " ci  operator " "deploy-dev run $GITHUB_RUN_ID" 2>"$RUNNER_TEMP/same.txt"; then
            echo "::error::the ceremony ran with the operator as the witness"
            exit 1
          fi
          grep -F "the witness is the operator" "$RUNNER_TEMP/same.txt"
          bash ../../scripts/signing-key-ceremony.sh ./keys "CI Operator" "CI Witness" "deploy-dev run $GITHUB_RUN_ID" \
            | tee "$RUNNER_TEMP/ceremony.txt"
          if bash ../../scripts/signing-key-ceremony.sh ./keys "CI Operator" "CI Witness" "a second key" >/dev/null 2>&1; then
            echo "::error::a second ceremony replaced the keystore"
            exit 1
          fi
          kid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["key"]["kid"])' keys/realm-signing.ceremony.json)"
          echo "CEREMONY_KID=$kid" >> "$GITHUB_ENV"

      - name: start the stack, which applies the realm
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 300 postgres keycloak caddy
          # The realm-apply job is one-shot, so it is waited on by exit code rather than by --wait.
          docker compose -f compose.yaml -f compose.ci.yaml up -d realm-apply
          code="$(docker wait "$(docker compose -f compose.yaml -f compose.ci.yaml ps -aq realm-apply)")"
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color realm-apply
          [ "$code" = "0" ] || { echo "::error::the realm-apply job exited $code"; exit 1; }

      - name: the kernel image was built here, not pulled
        run: |
          digests="$(docker image inspect -f '{{len .RepoDigests}}' scnehaux/identity-kernel:dev)"
          if [ "$digests" != 0 ]; then
            echo "::error::scnehaux/identity-kernel:dev carries a registry digest: it was pulled, not built"
            exit 1
          fi
          echo "scnehaux/identity-kernel:dev has no registry digest: built here"

      # The key is owned by the runner here, because the check below runs realm-apply on the runner
      # rather than in its container. On a server it belongs to the container's user, the default.
      - name: create the realm-apply service account, with its key
        run: |
          bash ./new-client-key.sh realm-apply ./keys "$(id -u):$(id -g)"
          bash ./create-apply-client.sh > "$RUNNER_TEMP/client.env"

      - name: the job left nothing to change, as the service account sees it
        working-directory: .
        run: |
          set -a; . "$RUNNER_TEMP/client.env"; set +a
          export KEYCLOAK_ADMIN_CLIENT_KEY_FILE=deploy/dev/keys/realm-apply.pem
          # With the ceremony's certificate: the realm signs with the keystore the ceremony made.
          go run ./cmd/realm-apply -environment development -url http://localhost:8080 -require-in-sync \
            -signing-certificate deploy/dev/keys/realm-signing.crt

      # The witness's check, step 5 of the ceremony runbook: the kid the ceremony recorded is the one the
      # key set publishes through the proxy, and a token the realm issues carries it.
      - name: the realm signs with the ceremony's key, under its recorded kid
        run: |
          set -a; . ./.env; set +a
          kc() { docker compose -f compose.yaml -f compose.ci.yaml exec -T keycloak /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm-ci.config; }
          kc config credentials --server http://localhost:8080 --realm master --user admin --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
          curl -sfk https://localhost/realms/scnehaux/protocol/openid-connect/certs > "$RUNNER_TEMP/certs.json"
          # A throwaway client, deleted at once, for one token of the realm's.
          secret="$(openssl rand -hex 16)"
          kc create clients -r scnehaux -s clientId=deploy-dev-kid-probe -s publicClient=false -s "secret=$secret" \
            -s serviceAccountsEnabled=true -s standardFlowEnabled=false >/dev/null
          curl -sfk https://localhost/realms/scnehaux/protocol/openid-connect/token \
            -d grant_type=client_credentials -d client_id=deploy-dev-kid-probe -d "client_secret=$secret" \
            > "$RUNNER_TEMP/token.json"
          id="$(kc get clients -r scnehaux -q clientId=deploy-dev-kid-probe --fields id | jq -r '.[0].id')"
          kc delete "clients/$id" -r scnehaux
          python3 - "$RUNNER_TEMP/certs.json" "$RUNNER_TEMP/token.json" "$CEREMONY_KID" <<'PY'
          import base64, json, sys
          certs, token, kid = json.load(open(sys.argv[1])), json.load(open(sys.argv[2])), sys.argv[3]
          published = sorted(k["kid"] for k in certs["keys"] if k.get("alg") == "PS256")
          assert published == [kid], f"the key set publishes PS256 keys {published}, want the ceremony's {kid} alone"
          segment = token["access_token"].split(".")[0]
          header = json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))
          assert header["alg"] == "PS256" and header["kid"] == kid, f"the token header is {header}, want PS256 and {kid}"
          print(f"the key set and a token carry the ceremony's kid {kid}")
          PY

      # The job must refuse drift, not overwrite it: a declared value changed in Keycloak by hand makes
      # the next up fail and leaves the change in place for someone to look at. Reverted, the next up
      # succeeds again.
      - name: console drift makes the next up fail, and changes nothing
        run: |
          files="-f compose.yaml -f compose.ci.yaml"
          set -a; . ./.env; set +a
          kc() { docker compose $files exec -T keycloak /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm-ci.config; }
          rerun() {
            docker compose $files up -d --force-recreate realm-apply >/dev/null
            code="$(docker wait "$(docker compose $files ps -aq realm-apply)")"
            docker compose $files logs --no-color realm-apply | tail -n 5
            echo "$code"
          }
          kc config credentials --server http://localhost:8080 --realm master --user admin --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
          kc update realms/scnehaux -s registrationAllowed=true
          code="$(rerun | tail -n 1)"
          if [ "$code" = "0" ]; then echo "::error::the job applied over console drift"; exit 1; fi
          kc get realms/scnehaux --fields registrationAllowed | grep -q true || { echo "::error::the refused job changed the drifted value"; exit 1; }
          kc update realms/scnehaux -s registrationAllowed=false
          code="$(rerun | tail -n 1)"
          [ "$code" = "0" ] || { echo "::error::the job still refuses after the drift was reverted"; exit 1; }

      - name: the proxy serves the realm on its public issuer
        run: |
          discovery="$(curl -sfk https://localhost/realms/scnehaux/.well-known/openid-configuration)"
          issuer="$(printf '%s' "$discovery" | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuer"])')"
          if [ "$issuer" != "https://localhost/realms/scnehaux" ]; then
            echo "::error::issuer through the proxy is '$issuer', want https://localhost/realms/scnehaux"
            exit 1
          fi

      - name: administration is hidden outside the allowlist
        run: |
          failed=0
          for path in /admin /admin/ /admin/master/console/ /admin/realms/scnehaux \
                      /realms/master /realms/master/.well-known/openid-configuration \
                      /realms/master/protocol/openid-connect/token; do
            status="$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$path")"
            echo "$path -> $status"
            if [ "$status" != "404" ]; then
              echo "::error::$path answered $status through the proxy to an address outside ADMIN_ALLOW_CIDRS"
              failed=1
            fi
          done
          exit "$failed"

      # The legacy realm endpoint makes Keycloak generate an RS256 key in-process once the realm's RS256
      # provider is disabled, so the proxy closes it to everyone, in any spelling (TDD-identity-kernel-002
      # §The Published Key Set). The key set it would have joined still holds the keystore's key alone.
      - name: the legacy realm endpoint is closed, and the key set holds one key
        run: |
          failed=0
          for path in /realms/scnehaux /realms/scnehaux/ //realms//scnehaux "/realms/scnehaux;x=1" /REALMS/scnehaux /realms/%73cnehaux; do
            status="$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$path")"
            echo "$path -> $status"
            [ "$status" = 404 ] || { echo "::error::$path answered $status through the proxy"; failed=1; }
          done
          curl -sfk https://localhost/realms/scnehaux/protocol/openid-connect/certs \
            | jq -e --arg kid "$CEREMONY_KID" '[.keys[].kid] == [$kid]' \
            || { echo "::error::the key set holds more than the ceremony's key"; failed=1; }
          exit "$failed"

      # Last, because it deletes the database (STD-GLB-002 §Restore Evidence): backup.sh, the volume
      # deleted, restore.sh into an empty one, and the restored realm compared with the source and
      # signing with the same keystore key (scripts/dev-restore-drill.sh).
      - name: the restore drill
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
        run: bash ../../scripts/dev-restore-drill.sh "$RUNNER_TEMP/restore-drill"

      # The evidence, never the backup: the dump and the roles file hold role password hashes.
      - name: keep the restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-evidence
          path: |
            ${{ runner.temp }}/restore-drill/*.json
            ${{ runner.temp }}/restore-drill/*.txt
            ${{ runner.temp }}/restore-drill/*.sql
            !${{ runner.temp }}/restore-drill/backup/**
          if-no-files-found: ignore
          retention-days: 90

      - name: stack logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color

  # Tunnel mode: the same stack reached through a public dev tunnel instead of a DNS name. The runner
  # stands in for the tunnel: http://localhost:8080 is what the public tunnel forwards to, and the
  # issuer is fixed to https://localhost:8080 as the tunnel's TLS would make it. Administration must be
  # refused there to everyone -- an allowlist cannot work behind a tunnel -- and served on the private
  # port.
  tunnel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: configure the stack for a tunnel
        run: |
          {
            echo "KEYCLOAK_HOSTNAME=localhost:8080"
            echo "ADMIN_ALLOW_CIDRS=127.0.0.1/32"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KC_BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "KC_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "KEYCLOAK_ADMIN_URL=http://localhost:8081"
          } > .env

      # STD-GLB-009 1.8.0 rule 11 (TDD-identity-kernel-005 §Images the Stack Runs): no image this stack
      # names without a digest is pulled from a registry. Compose pulls a name before building it unless
      # pull_policy says otherwise, so every such name must be build where its service builds it and
      # never elsewhere. Checked on every file set the stack runs, before anything is pulled.
      - name: no image named here is pulled from a registry
        run: |
          files=()
          for set in compose.yaml compose.yaml:compose.tunnel.yaml compose.yaml:compose.ci.yaml; do
            out="$RUNNER_TEMP/compose-config-${set//[:.]/-}.json"
            COMPOSE_FILE="$set" docker compose config --format json > "$out"
            files+=("$out")
          done
          python3 ../../.github/scripts/pull-policy.py "${files[@]}"

      - name: the signing-key ceremony
        run: bash ../../scripts/signing-key-ceremony.sh ./keys "CI Operator" "CI Witness" "deploy-dev run $GITHUB_RUN_ID"

      - name: start the stack in tunnel mode, which applies the realm
        run: |
          docker compose -f compose.yaml -f compose.tunnel.yaml up -d --wait --wait-timeout 300 postgres keycloak caddy
          # The realm-apply job is one-shot, so it is waited on by exit code rather than by --wait.
          docker compose -f compose.yaml -f compose.tunnel.yaml up -d realm-apply
          code="$(docker wait "$(docker compose -f compose.yaml -f compose.tunnel.yaml ps -aq realm-apply)")"
          docker compose -f compose.yaml -f compose.tunnel.yaml logs --no-color realm-apply
          [ "$code" = "0" ] || { echo "::error::the realm-apply job exited $code"; exit 1; }

      - name: the kernel image was built here, not pulled
        run: |
          digests="$(docker image inspect -f '{{len .RepoDigests}}' scnehaux/identity-kernel:dev)"
          if [ "$digests" != 0 ]; then
            echo "::error::scnehaux/identity-kernel:dev carries a registry digest: it was pulled, not built"
            exit 1
          fi
          echo "scnehaux/identity-kernel:dev has no registry digest: built here"

      - name: create the realm-apply service account, with its key
        run: |
          bash ./new-client-key.sh realm-apply ./keys "$(id -u):$(id -g)"
          bash ./create-apply-client.sh > "$RUNNER_TEMP/client.env"

      # The admin login, not just the console page. KC_HOSTNAME_ADMIN moves the console to the private
      # port, but the master realm's login is built from KC_HOSTNAME, so the form posts to the public
      # port -- where /realms/master is refused. Found on the development server, behind the real
      # tunnel; the console-page check below passed throughout. Asserted red before tunnel-admin.sh and
      # green after it, so the check is known to see the failure it exists for.
      - name: the admin login is broken until tunnel-admin.sh runs
        run: |
          if ADMIN_URL=http://localhost:8081 python3 ../../.github/scripts/admin-login.py; then
            echo "::error::the admin login succeeded before tunnel-admin.sh; the check cannot tell the difference"
            exit 1
          fi

      - name: serve the master realm's login from the admin port
        run: bash ./tunnel-admin.sh

      - name: an administrator can log in on the private port
        run: ADMIN_URL=http://localhost:8081 python3 ../../.github/scripts/admin-login.py
      - name: the job left nothing to change, seen through the private port
        working-directory: .
        run: |
          set -a; . "$RUNNER_TEMP/client.env"; set +a
          export KEYCLOAK_ADMIN_CLIENT_KEY_FILE=deploy/dev/keys/realm-apply.pem
          # The master realm's frontend URL is now the private port, so the assertion's audience is
          # not the address realm-apply reaches Keycloak on. Discovery supplies it.
          go run ./cmd/realm-apply -environment development -url http://localhost:8081 -require-in-sync \
            -signing-certificate deploy/dev/keys/realm-signing.crt

      - name: the public port serves the realm on the tunnel's issuer
        run: |
          discovery="$(curl -sf http://localhost:8080/realms/scnehaux/.well-known/openid-configuration)"
          issuer="$(printf '%s' "$discovery" | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuer"])')"
          if [ "$issuer" != "https://localhost:8080/realms/scnehaux" ]; then
            echo "::error::issuer through the public port is '$issuer', want https://localhost:8080/realms/scnehaux"
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/realms/scnehaux/account)"
          [ "$status" = "200" ] || { echo "::error::the account console answered $status on the public port"; exit 1; }

      - name: administration is refused on the public port, to everyone
        run: |
          failed=0
          for path in /admin /admin/ /admin/master/console/ /admin/realms/scnehaux \
                      /realms/master /realms/master/.well-known/openid-configuration \
                      /realms/master/protocol/openid-connect/token; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")"
            echo "$path -> $status"
            if [ "$status" != "404" ]; then
              echo "::error::$path answered $status on the public port; a public tunnel would expose it"
              failed=1
            fi
          done
          exit "$failed"

      - name: the legacy realm endpoint is closed on the public port
        run: |
          for path in /realms/scnehaux /realms/scnehaux/ "/realms/scnehaux;x=1"; do
            status="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")"
            echo "$path -> $status"
            [ "$status" = 404 ] || { echo "::error::$path answered $status on the public port"; exit 1; }
          done

      # The positive control for the step above: a 404 on every path would also be what a proxy that
      # served nothing returns. Here the console is served, and it points its login at the private
      # port, which is what KC_HOSTNAME_ADMIN is for.
      - name: administration is served on the private port
        run: |
          page="$(curl -sf http://localhost:8081/admin/master/console/)"
          if ! printf '%s' "$page" | grep -q 'localhost:8081'; then
            echo "::error::the admin console on the private port does not point at it; its login would go to the public host"
            printf '%s' "$page" | head -c 2000
            exit 1
          fi

      - name: stack logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.tunnel.yaml logs --no-color
