name: compat

# The declared realm contract, asserted against the exact Keycloak image in image/keycloak.ref.
#
# It runs in CI rather than on a developer's machine by design, not only by necessity: the
# proof-of-concept answers recorded here are answers about one image digest, and the runner is the
# one place that fetches exactly those bytes every time. The job summary carries the answer and the
# digest it was answered against.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  contract:
    runs-on: ubuntu-latest

    env:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_MANAGEMENT_URL: http://localhost:9000
      # Throwaway credentials for a throwaway instance that lives for the length of this job.
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Turns a skipped suite into a failure. Without it, a Keycloak that never came up would leave
      # every assertion unrun and the build green.
      REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./internal/... -count=1

      # A step rather than a service container: services cannot be given a command, and Keycloak
      # needs one (start-dev). The reference is read from the file and checked for the digest form,
      # so a tag slipped into image/keycloak.ref fails here instead of being run.
      - name: start the pinned Keycloak
        run: |
          image="$(grep -v '^[[:space:]]*#' image/keycloak.ref | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          if ! printf '%s' "$image" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
            echo "::error::image/keycloak.ref must pin the image by sha256 digest, found '$image'"
            exit 1
          fi
          # The kernel image: the pinned upstream with this repository's theme (TDD-identity-kernel-005).
          echo "building the kernel image from $image"
          docker build -q -f image/Dockerfile --build-arg KEYCLOAK_IMAGE="$image" -t identity-kernel:ci . >/dev/null
          # start-dev builds again in development mode, on its own file database: the image's
          # postgres is named back to dev-file here, and health and metrics stay on.
          # host.docker.internal is the runner, where compat/back_channel_logout_test.go listens for the
          # logout tokens the kernel posts (ADR-IAM-009).
          docker run -d --name keycloak -p 8080:8080 -p 9000:9000 --add-host host.docker.internal:host-gateway \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USER" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_DB=dev-file -e KC_HEALTH_ENABLED=true -e KC_METRICS_ENABLED=true \
            identity-kernel:ci start-dev

      # Every template the theme copies is the release's own with the replacements
      # themes/overrides.json declares (TDD-identity-kernel-004 §Override Surface), read from the
      # image the suite runs. A release that changes or fixes a copied template fails here.
      - name: the theme's copied templates match the release
        run: |
          # The themes jar alone: keycloak-themes-vendor sits beside it under the same prefix.
          docker run --rm --entrypoint /bin/bash identity-kernel:ci \
            -c 'cat /opt/keycloak/lib/lib/main/org.keycloak.keycloak-themes-[0-9]*.jar' > "$RUNNER_TEMP/themes.jar"
          go run ./cmd/theme-overrides -jar "$RUNNER_TEMP/themes.jar"

      - name: wait for Keycloak to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then
              echo "ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Keycloak did not report ready within 180s"
          docker logs keycloak
          exit 1

      # The realm is applied by the tool a server is applied with, so the suite asserts what that
      # tool produces. The plan that follows proves the apply converged: nothing left to change, and
      # the recorded revision read back from git reproduces what was applied.
      - name: apply the realm definition
        run: go run ./cmd/realm-apply -environment ci -apply

      - name: a second run changes nothing
        run: go run ./cmd/realm-apply -environment ci -require-in-sync

      - name: realm contract and proof-of-concept questions
        run: go test ./compat -count=1 -v

      # The suite changes the realm and must put it back; a test that left drift behind would be
      # asserting against a realm the definition does not describe.
      - name: the suite left the realm as the definition describes it
        run: go run ./cmd/realm-apply -environment ci -require-in-sync

      - name: Keycloak log
        if: failure()
        run: docker logs keycloak

  # The hosted login pages in a real browser (TDD-identity-kernel-004 §Testing Strategy): axe-core
  # over every surface a sign-in reaches, in both locales and both colour schemes; the password and
  # the one-time code typed from the keyboard; a passkey through Chromium's virtual authenticator;
  # and no Content Security Policy violation on any page (STD-IAM-001 §3.9). The same kernel image
  # and realm as the contract job, on an instance of its own.
  browser:
    runs-on: ubuntu-latest

    env:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: browser/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml

      # The lockfile is the dependency set; an install that would change it fails.
      - name: install the suite
        working-directory: browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: start the kernel image
        run: |
          image="$(grep -v '^[[:space:]]*#' image/keycloak.ref | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]')"
          docker build -q -f image/Dockerfile --build-arg KEYCLOAK_IMAGE="$image" -t identity-kernel:ci . >/dev/null
          # host.docker.internal is the runner, where compat/back_channel_logout_test.go listens for the
          # logout tokens the kernel posts (ADR-IAM-009).
          docker run -d --name keycloak -p 8080:8080 -p 9000:9000 --add-host host.docker.internal:host-gateway \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USER" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
            -e KC_DB=dev-file -e KC_HEALTH_ENABLED=true -e KC_METRICS_ENABLED=true \
            identity-kernel:ci start-dev
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Keycloak did not report ready within 180s"
          docker logs keycloak
          exit 1

      - name: apply the realm definition
        run: go run ./cmd/realm-apply -environment ci -apply

      - name: the login pages in a browser
        working-directory: browser
        run: |
          {
            echo "### The login pages under axe-core (WCAG 2.2 A and AA)"
            echo
            echo "| Surface | Locale | Scheme | Rules passed | Violations |"
            echo "| :-- | :-- | :-- | --: | --: |"
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm test

      - name: the suite left the realm as the definition describes it
        run: go run ./cmd/realm-apply -environment ci -require-in-sync

      - name: Keycloak log
        if: failure()
        run: docker logs keycloak

  # The rollback boundary, determined by attempting the downgrade (TDD-identity-kernel-005
  # §Determining the Rollback Boundary). On PostgreSQL, the database every server runs: the
  # in-process database start-dev uses in the job above is not one anybody upgrades. The previous
  # release creates the database, the candidate upgrades it, and the previous release is started on
  # what the candidate left. The job summary is the release record.
  upgrade:
    runs-on: ubuntu-latest

    env:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      PGHOST: localhost
      PGUSER: keycloak
      PGPASSWORD: keycloak
      PGDATABASE: keycloak

    services:
      postgres:
        # postgres:17.11-alpine, the digest deploy/dev/compose.yaml runs.
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: keycloak
          POSTGRES_PASSWORD: keycloak
          POSTGRES_DB: keycloak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: read the candidate and the previous release
        run: |
          ref() { grep -v '^[[:space:]]*#' "$1" | grep -v '^[[:space:]]*$' | head -n 1 | tr -d '[:space:]'; }
          candidate="$(ref image/keycloak.ref)"
          previous="$(ref image/keycloak.previous.ref)"
          for r in "$candidate" "$previous"; do
            if ! printf '%s' "$r" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
              echo "::error::both references must pin by sha256 digest, found '$r'"
              exit 1
            fi
          done
          if [ "$candidate" = "$previous" ]; then
            echo "::error::image/keycloak.previous.ref equals image/keycloak.ref; it names the release this one replaces"
            exit 1
          fi
          # Each release runs as the kernel image built from it, theme included, as a server runs it.
          docker build -q -f image/Dockerfile --build-arg KEYCLOAK_IMAGE="$candidate" -t identity-kernel:candidate . >/dev/null
          docker build -q -f image/Dockerfile --build-arg KEYCLOAK_IMAGE="$previous" -t identity-kernel:previous . >/dev/null
          echo "CANDIDATE=identity-kernel:candidate" >> "$GITHUB_ENV"
          echo "PREVIOUS=identity-kernel:previous" >> "$GITHUB_ENV"
          echo "CANDIDATE_UPSTREAM=$candidate" >> "$GITHUB_ENV"
          echo "PREVIOUS_UPSTREAM=$previous" >> "$GITHUB_ENV"

      # One Keycloak at a time, on the host network so it reaches the service's port. start-dev for
      # the reason the job above gives; the migrations a release applies are the same under start.
      - name: write the Keycloak helpers
        run: |
          cat > "$RUNNER_TEMP/keycloak.sh" <<'SH'
          start() {
            docker run -d --name keycloak --network host \
              -e KC_DB=postgres -e KC_DB_URL=jdbc:postgresql://localhost:5432/keycloak \
              -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD=keycloak \
              -e KC_BOOTSTRAP_ADMIN_USERNAME="$KEYCLOAK_ADMIN_USER" \
              -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD" \
              -e KC_HEALTH_ENABLED=true \
              "$1" start-dev >/dev/null
          }
          ready() {
            for i in $(seq 1 90); do
              if curl -fsS http://localhost:9000/health/ready >/dev/null 2>&1; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' keycloak)" != "true" ]; then return 1; fi
              sleep 2
            done
            return 1
          }
          stop() {
            docker logs keycloak > "$RUNNER_TEMP/keycloak-$1.log" 2>&1 || true
            docker rm -f keycloak >/dev/null
          }
          changesets() { psql -Atc "SELECT id FROM databasechangelog ORDER BY id"; }
          SH

      - name: the previous release creates the database and the realm
        run: |
          . "$RUNNER_TEMP/keycloak.sh"
          start "$PREVIOUS"
          if ! ready; then
            docker logs keycloak
            echo "::error::the previous release did not start on an empty database: there is no upgrade to judge"
            exit 1
          fi
          go run ./cmd/realm-apply -environment ci -apply
          changesets > "$RUNNER_TEMP/changesets-before.txt"
          stop previous

      - name: the candidate upgrades it
        run: |
          . "$RUNNER_TEMP/keycloak.sh"
          start "$CANDIDATE"
          if ! ready; then
            docker logs keycloak
            echo "::error::the candidate did not start on the previous release's database"
            exit 1
          fi
          changesets > "$RUNNER_TEMP/changesets-after.txt"
          comm -13 "$RUNNER_TEMP/changesets-before.txt" "$RUNNER_TEMP/changesets-after.txt" > "$RUNNER_TEMP/applied.txt"
          psql -Atc "SELECT version FROM migration_model ORDER BY update_time DESC LIMIT 1" > "$RUNNER_TEMP/model.txt"
          go run ./cmd/realm-apply -environment ci -require-in-sync
          stop candidate

      - name: the previous release starts on the migrated database
        run: |
          . "$RUNNER_TEMP/keycloak.sh"
          start "$PREVIOUS"
          boundary=irreversible-after-start
          if ready && go run ./cmd/realm-apply -environment ci -require-in-sync; then
            boundary=reversible
          fi
          stop rollback
          echo "BOUNDARY=$boundary" >> "$GITHUB_ENV"
          if [ "$boundary" != reversible ]; then
            echo "::warning::rollback boundary: irreversible-after-start; the recovery path is restore-from-backup"
            tail -n 60 "$RUNNER_TEMP/keycloak-rollback.log"
          fi

      - name: release record
        run: |
          {
            echo "## Release record"
            echo
            echo "| Field | Value |"
            echo "| :-- | :-- |"
            echo "| candidate | \`$CANDIDATE_UPSTREAM\` with the login theme |"
            echo "| previous | \`$PREVIOUS_UPSTREAM\` with the login theme |"
            echo "| migration model after the upgrade | \`$(cat "$RUNNER_TEMP/model.txt")\` |"
            if [ -s "$RUNNER_TEMP/applied.txt" ]; then
              echo "| schema_migration_applied | yes: \`$(paste -sd, "$RUNNER_TEMP/applied.txt" | sed 's/,/\`, \`/g')\` |"
            else
              echo "| schema_migration_applied | no |"
            fi
            echo "| realm in sync after the upgrade | yes |"
            echo "| rollback_boundary | $BOUNDARY |"
            echo "| rollback_rehearsed | yes: the previous release started on the migrated database |"
            echo "| extension_versions | no extension is packaged yet; the login theme is git tree \`$(git rev-parse HEAD:themes/scnehaux)\` |"
            echo "| evaluated_at | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Printed as well as summarized: the log is what a run id retrieves later, and the
          # release record is cited by run id.

      - name: Keycloak logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/keycloak-*.log 2>/dev/null || docker logs keycloak
