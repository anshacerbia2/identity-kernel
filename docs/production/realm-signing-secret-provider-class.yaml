# The realm signing keystores' delivery in production (ADR-IAM-002 §5.3 and §5.5 Q3, Q8;
# TDD-identity-kernel-002 1.5.0 §Custody as Built and §Rotation as Built). A documented artifact,
# reviewed with the design and not deployed: no production environment exists, so deploy/ holds no prod
# directory yet (STD-GLB-009 rule 12), and no CI job calls AWS. When the environment is built, this
# moves to deploy/prod/ with its values filled in.
#
# Each key is one keystore and one password, each its own secret, named by the key's kid
# (ADR-IAM-002 §5.5 Q3), so a key's pair is two objects here: its keystore in the first class, its
# password in the second. Staging a key adds its pair and rolls the replicas before the rotation step
# creates its provider; retiring, abandoning or revoking it removes its pair and rolls the replicas
# after its provider is removed and before its secrets are deleted (Q8 step 2). The example below holds
# two keys, an active one and a staged one.
#
# Two classes, because the kernel reads two directories: the keystores from the realm's keystore
# directory, /opt/keycloak/data/scnehaux, and their passwords from the file vault, $KC_VAULT_DIR,
# /opt/keycloak/vault in the image. Each is a CSI volume of the kernel's pods, mounted read-only:
#
#   volumes:
#     - name: realm-signing-keystores
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes: {secretProviderClass: identity-kernel-realm-signing-keystores}
#     - name: realm-signing-vault
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes: {secretProviderClass: identity-kernel-realm-signing-vault}
#   containers:
#     - name: keycloak
#       volumeMounts:
#         - {name: realm-signing-keystores, mountPath: /opt/keycloak/data/scnehaux, readOnly: true}
#         - {name: realm-signing-vault, mountPath: /opt/keycloak/vault, readOnly: true}
#
# A key's secrets (docs/runbooks/signing-key-ceremony.md and signing-key-rotation.md, Production):
#
#   scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<kid>-keystore   SecretBinary, the PKCS#12 file
#   scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<kid>-password   SecretString, its password
#
# Each is written once, by CreateSecret, and has one version for its whole life: the policy denies
# secretsmanager:PutSecretValue and secretsmanager:UpdateSecret on every signing secret, and a retired
# key's secrets are deleted whole with ForceDeleteWithoutRecovery (ADR-IAM-002 §5.5 Q8). No signing
# secret is replicated to another Region. All are encrypted under the environment's one customer-managed
# KMS key, never aws/secretsmanager. The key policy lets only the kernel pods' role decrypt and keeps the
# key's administrators apart from its readers (ADR-IAM-002 §5.3, NIST AC-5). The pods' IAM role may call
# secretsmanager:GetSecretValue and secretsmanager:DescribeSecret on the signing secrets alone, as the
# ASCP guide's example policy grants. CloudTrail records every read and every deletion.
#
# The file names are the kernel's (image/start.sh): realm-signing-<kid>.p12 for a keystore, and
# scnehaux_realm-signing-<kid> for its password, with every underscore of the kid doubled, as Keycloak's
# file vault resolves ${vault.realm-signing-<kid>}.
#
# <environment>, <region>, the KMS key and the kids are the environment's; they are not chosen here.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-kernel-realm-signing-keystores
  namespace: identity-kernel
spec:
  provider: aws
  parameters:
    region: <region>
    objects: |
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<active kid>-keystore"
        objectType: "secretsmanager"
        objectAlias: "realm-signing-<active kid>.p12"
        filePermission: "0400"
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<staged kid>-keystore"
        objectType: "secretsmanager"
        objectAlias: "realm-signing-<staged kid>.p12"
        filePermission: "0400"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-kernel-realm-signing-vault
  namespace: identity-kernel
spec:
  provider: aws
  parameters:
    region: <region>
    objects: |
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<active kid>-password"
        objectType: "secretsmanager"
        objectAlias: "scnehaux_realm-signing-<active kid, underscores doubled>"
        filePermission: "0400"
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-<staged kid>-password"
        objectType: "secretsmanager"
        objectAlias: "scnehaux_realm-signing-<staged kid, underscores doubled>"
        filePermission: "0400"
