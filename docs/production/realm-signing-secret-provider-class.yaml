# The realm signing keystore's delivery in production (ADR-IAM-002 §5.3, TDD-identity-kernel-002 1.2.0
# §Custody as Built). A documented artifact, reviewed with the design and not deployed: no production
# environment exists, so deploy/ holds no prod directory yet (STD-GLB-009 rule 12), and no CI job calls
# AWS. When the environment is built, this moves to deploy/prod/ with its values filled in.
#
# Two objects, because the kernel reads two directories: the keystore from the realm's keystore
# directory, /opt/keycloak/data/scnehaux, and its password from the file vault, $KC_VAULT_DIR,
# /opt/keycloak/vault in the image. Each is a CSI volume of the kernel's pods, mounted read-only:
#
#   volumes:
#     - name: realm-signing-keystore
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes: {secretProviderClass: identity-kernel-realm-signing-keystore}
#     - name: realm-signing-vault
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes: {secretProviderClass: identity-kernel-realm-signing-vault}
#   containers:
#     - name: keycloak
#       volumeMounts:
#         - {name: realm-signing-keystore, mountPath: /opt/keycloak/data/scnehaux, readOnly: true}
#         - {name: realm-signing-vault, mountPath: /opt/keycloak/vault, readOnly: true}
#
# The secrets (docs/runbooks/signing-key-ceremony.md, Production):
#
#   scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-keystore   SecretBinary, the PKCS#12 file
#   scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-password   SecretString, its password
#
# Both are encrypted under the environment's customer-managed KMS key, never aws/secretsmanager. The
# key policy lets only the kernel pods' role decrypt and keeps the key's administrators apart from its
# readers (ADR-IAM-002 §5.3, NIST AC-5). The pods' IAM role may call secretsmanager:GetSecretValue and
# secretsmanager:DescribeSecret on these two secrets alone, as the ASCP guide's example policy grants.
# CloudTrail records every read.
#
# <environment>, <region> and the KMS key are the environment's; they are not chosen here.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-kernel-realm-signing-keystore
  namespace: identity-kernel
spec:
  provider: aws
  parameters:
    region: <region>
    objects: |
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-keystore"
        objectType: "secretsmanager"
        objectAlias: "realm-signing.p12"
        filePermission: "0400"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-kernel-realm-signing-vault
  namespace: identity-kernel
spec:
  provider: aws
  parameters:
    region: <region>
    objects: |
      - objectName: "scnehaux/<environment>/identity-kernel/scnehaux/realm-signing-password"
        objectType: "secretsmanager"
        objectAlias: "scnehaux_realm-signing-password"
        filePermission: "0400"
