# Grype configuration for scripts/image-scan.sh (STD-GLB-009 1.4.0 §Container Images).
#
# An ignore rule names the vulnerability and the package. Its reason begins "review-by YYYY-MM-DD:",
# at most 90 days ahead, and says why the finding does not apply or what it waits for. The scan
# fails once a rule's date has passed.
check-for-app-update: false
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
    reason: >-
      review-by 2026-10-21: in postgres:17.11-alpine, the kernel's database image.
      Alpine ships the fix as zlib 1.3.2-r1, and the official image has not been rebuilt with it: on
      2026-10-07 the tag still resolves to the pinned digest. Waits for that rebuild, then the pin moves.
  - vulnerability: CVE-2026-103111
    package:
      name: pcre2
    reason: >-
      review-by 2026-10-21: in alpine/git:2.54.0, realm-apply's base, whose newest build (2026-10-04)
      still carries pcre2 10.48. The flaw needs an attacker-controlled regular expression and JIT use;
      realm-apply runs git over this repository's own definition with no pattern from outside. Waits
      for an alpine/git build with pcre2 10.49, then the pin moves.
