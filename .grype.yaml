# Grype configuration for scripts/image-scan.sh (STD-GLB-009 1.8.0 §Container Images, which lands with
# scnehaux-architecture #86; TDD-identity-kernel-005 §Images the Stack Runs).
#
# An ignore rule is a VEX statement about one artifact (rule 5). It matches on vulnerability, package
# name, version and type, and, for a package found inside a file, the file's full path in the image
# (package.location, no wildcard), so it stops matching when the version changes or the file moves.
# Its reason reads
#
#   review-by YYYY-MM-DD: <affected | not_affected/<justification>>: detected YYYY-MM-DD: <images>: <statement>
#
# `affected` carries the action statement: the CISA BOD 26-04 inputs and time it used (rule 8), what the
# finding waits for, and where that was asked. `not_affected` carries the evidence rule 7 asks for.
# scripts/image-scan-rules.py checks the form and the dates before every scan, and the scan fails once
# a review date has passed.
#
# One file serves every image scanned here, and Alpine's package database is the same path in each, so
# a rule for an apk package matches that package in every Alpine image. The version is what keeps it to
# the image it is written for: the proxy and realm-apply carry zlib 1.3.2-r1, which the rule below does
# not match.
check-for-app-update: false
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      version: 1.3.2-r0
      type: apk
    reason: >-
      review-by 2026-11-16: affected: detected 2026-10-07:
      postgres:17.11-alpine (postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24): Rule 8
      inputs: not publicly exposed (the database is on the stack's internal network only, no published
      port); not in the KEV (catalog 2026.10.08); Vulnrichment (CISA ADP, 2026-09-03) Automatable no,
      Technical Impact total, Exploitation poc. Table 1 gives fix on system upgrade, for an image run
      without building the next pin move, within 90 days of detection: by 2027-01-05. Waits for the
      official image to be rebuilt on an Alpine base with zlib 1.3.2-r1, which Alpine already ships;
      on 2026-10-10 postgres:17.11-alpine still resolves to the pinned digest and alpine:3.24 (3.24.2,
      built 2026-09-17) still carries 1.3.2-r0, and no rebuild date is announced. Not yet asked of the
      upstream: no docker-library/postgres issue names it on 2026-10-10. Reviewed on this date to move
      the pin as soon as the rebuild lands; when the rule 8 date would pass first, the stack builds its
      own image from the pinned one with the upgrade line (rule 10). Reviewed 2026-10-19: both tags
      still resolve to the pinned digest; the next PostgreSQL minor release is 2026-11-12, so the review
      moves to 2026-11-16, as in identity-control and organization-control.
  # The kernel image: two findings in what Keycloak 26.7.5 ships, which no rebuild here can fix.
  - vulnerability: GHSA-xxph-c9ww-hj94
    package:
      name: guava
      version: 33.5.0-jre
      type: java-archive
      location: /opt/keycloak/lib/lib/main/com.google.guava.guava-33.5.0-jre.jar
    reason: >-
      review-by 2026-11-30: affected: detected 2026-10-28: the kernel image (image/Dockerfile on
      image/keycloak.ref, Keycloak 26.7.5): CVE-2026-102554, deserialization of Guava's compact
      collections allocates memory without bound; fixed in Guava 33.7.2, which no Keycloak release
      carries on 2026-10-31 (26.8.1, 2026-10-13, is the newest). Rule 8 inputs: not publicly exposed
      (reached only through the proxy); not in the KEV (catalog 2026.10.30); Vulnrichment (CISA ADP,
      2026-10-09) Automatable no, Technical Impact partial, Exploitation poc. Table 1 gives fix on
      system upgrade: the next move of image/keycloak.ref, within 90 days of detection, by 2027-01-26.
      Asked upstream: keycloak/keycloak#54110, open. Reviewed by this date for a Keycloak release that
      carries the fix. TDD-identity-kernel-005 1.15.0 §Images the Stack Runs.
  - vulnerability: CVE-2026-91415
    package:
      name: java-21-openjdk-headless
      version: 1:21.0.12.1.1-1.2.el9
      type: rpm
    reason: >-
      review-by 2026-11-30: affected: detected 2026-10-31: the kernel image (image/Dockerfile on
      image/keycloak.ref, Keycloak 26.7.5): Oracle's October 2026 CPU, font rendering; RHEL 9 ships
      the fix as 1:21.0.13.0.9-1.2.el9 (RHSA-2026:88349, 2026-10-30). Not upgraded in the ubi9 stage:
      the JDK lives in a directory named for its version, and a COPY onto the Keycloak image cannot
      remove the old one or move the alternatives links, so the rpm database would report the new
      version while the old JVM may still run. Rule 8 inputs: not publicly exposed; not in the KEV
      (catalog 2026.10.30); Vulnrichment (CISA ADP) Automatable no, Technical Impact partial,
      Exploitation none. Table 1 gives fix on system upgrade: the next move of image/keycloak.ref,
      within 90 days of detection, by 2027-01-29. Not yet asked of the upstream: Keycloak rebuilds its
      image on each release. TDD-identity-kernel-005 1.15.0 §Images the Stack Runs.
